name: backend CICD

# BUILDS AND SHIPS THE API
# BUILD TESTS AND PUSHES IMAGE
# DEPLOY WAITS FOR APPROVAL

on:
  # PUSH TO MAIN DEPLOYS
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-cicd.yml'
  # PULL REQUESTS ONLY TEST
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-cicd.yml'
  # NEW INFRA TRIGGERS REDEPLOY
  workflow_run:
    workflows: ["infra CICD"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# ONE BACKEND DEPLOY AT A TIME
concurrency:
  group: trap-chat-backend-cicd
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-trap-chat-prod
  CONTAINER_APP_NAME: trap-chat-api
  IMAGE: ghcr.io/itmeansbigmountain/trap-chat-backend

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # SKIP AFTER FAILED INFRA RUN
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      # FETCH THE SOURCE
      - uses: actions/checkout@v4

      # INSTALL PYTHON
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # INSTALL RUNTIME AND TEST DEPENDENCIES
      - name: Install dependencies
        working-directory: backend
        run: pip install --no-cache-dir -r requirements.txt pytest==8.3.5

      # COMPILE CHECK, THEN RUN TESTS
      - name: Test
        working-directory: backend
        run: |
          python -m py_compile app.py
          python -m pytest tests/ -q

      # SIGN IN TO THE REGISTRY
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BUILD AND PUSH, SHA TAGGED
      # IMMUTABLE TAG MAKES DEPLOYS TRACEABLE
      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    name: Deploy
    needs: build
    # PULL REQUESTS NEVER DEPLOY
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: backend-prod
    steps:
      # APPROVAL GATE, SET IN SETTINGS
      # SETTINGS > ENVIRONMENTS > BACKEND-PROD
      # ADD ItMeansBigMountain AS REVIEWER
      # UNSET MEANS DEPLOY RUNS UNATTENDED
      #
      # OR UNCOMMENT TO GATE HERE
      # - name: Wait for ItMeansBigMountain to approve
      #   uses: trstringer/manual-approval@v1
      #   with:
      #     secret: ${{ github.TOKEN }}
      #     approvers: ItMeansBigMountain
      #     minimum-approvals: 1
      #     issue-title: "Approve the backend deploy for ${{ github.sha }}"

      # FETCH THE TEST SCRIPTS
      - uses: actions/checkout@v4

      # SIGN IN TO AZURE
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ROLL OUT THE NEW IMAGE
      # AZURE NEVER RE-PULLS A TAG
      - name: Roll out image to Container App
        run: |
          az extension add --name containerapp --upgrade -y
          # WAIT OUT ANY RUNNING OPERATION
          for i in $(seq 1 60); do
            state=$(az containerapp show --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.provisioningState -o tsv 2>/dev/null || echo NotFound)
            echo "attempt $i: provisioningState=$state"
            case "$state" in
              InProgress|Provisioning|Deleting) sleep 10 ;;
              *) break ;;
            esac
          done
          # RETRY THROUGH TRANSIENT AZURE ERRORS
          for attempt in 1 2 3 4 5; do
            if az containerapp update \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "${IMAGE}:${{ github.sha }}"; then
              echo "rollout succeeded on attempt $attempt"
              exit 0
            fi
            echo "rollout attempt $attempt failed, retrying in 20s"
            sleep 20
          done
          echo "::error::could not roll out the image after 5 attempts"
          exit 1

      # CONFIRM THE API ANSWERS
      - name: Verify backend health
        id: api
        run: |
          fqdn=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://${fqdn}" >> "$GITHUB_OUTPUT"
          echo "Checking https://${fqdn}/api/health"
          for i in $(seq 1 10); do
            if curl --fail --max-time 20 "https://${fqdn}/api/health"; then
              echo
              echo "- Backend: https://${fqdn}/api/health" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $i failed, retrying in 15s"
            sleep 15
          done
          echo "::error::backend health check never returned success"
          exit 1

      # EXERCISE THE DEPLOYED API FOR REAL
      # IDENTITY, ROOMS, MATCHMAKING, SOCKETS
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Post-deployment integration tests
        run: |
          python -m pip install --quiet requests
          python backend/e2e/api_smoke.py "${{ steps.api.outputs.url }}"
