name: backend CICD

# Full build-and-deploy pipeline for the Flask backend. Builds are not
# artifacted between pipelines: test, image build, and rollout all happen in
# this one workflow.
#
# Triggers:
#   - push to main touching backend/  -> test, build, push image, deploy
#   - pull request touching backend/  -> test only, never deploys
#   - after a successful "infra CICD" -> redeploy onto new/changed infra
#
# There are no manual deployment steps. Push a change to deploy it.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-cicd.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-cicd.yml'
  workflow_run:
    workflows: ["infra CICD"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: trap-chat-azure-deploy
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-trap-chat-prod
  CONTAINER_APP_NAME: trap-chat-api
  IMAGE: ghcr.io/itmeansbigmountain/trap-chat-backend

jobs:
  backend:
    name: Test, build and deploy backend
    runs-on: ubuntu-latest
    # Never deploy off the back of a failed infra run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: backend
        run: pip install --no-cache-dir -r requirements.txt pytest==8.3.5

      - name: Test
        working-directory: backend
        run: |
          python -m py_compile app.py api/index.py
          python -m pytest tests/ -q

      # --- Everything below deploys. Pull requests stop at the tests above. ---

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Azure login
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Pushing an image does not change what a running Container App serves:
      # Azure never re-pulls a mutable tag on its own. Roll out the immutable
      # per-commit tag so every deploy is a distinct, traceable revision.
      - name: Roll out image to Container App
        if: github.event_name != 'pull_request'
        run: |
          az extension add --name containerapp --upgrade -y
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${IMAGE}:${{ github.sha }}"

      - name: Verify backend health
        if: github.event_name != 'pull_request'
        run: |
          fqdn=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "Checking https://${fqdn}/api/health"
          for i in $(seq 1 10); do
            if curl --fail --max-time 20 "https://${fqdn}/api/health"; then
              echo
              echo "- Backend: https://${fqdn}/api/health" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $i failed, retrying in 15s"
            sleep 15
          done
          echo "::error::backend health check never returned success"
          exit 1
