name: backend CICD

# Two stages, so the run shows two bubbles: Build, then Deploy behind a
# manual approval gate.
#
#   Build  -> test, build the image, push it to GHCR
#   Deploy -> roll the image out to Azure Container Apps and verify health
#
# The approval gate is enforced by the GitHub Environment `backend-prod`,
# which must have at least one Required Reviewer configured under
# Settings -> Environments. GitHub auto-creates an environment on first use
# with NO protection rules, so without that one-time setup Deploy runs
# unattended.
#
# Triggers:
#   - push to main touching backend/  -> build, then gated deploy
#   - pull request touching backend/  -> build only, never deploys
#   - after a successful "infra CICD" -> redeploy onto new/changed infra

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-cicd.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-cicd.yml'
  workflow_run:
    workflows: ["infra CICD"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: trap-chat-backend-cicd
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-trap-chat-prod
  CONTAINER_APP_NAME: trap-chat-api
  IMAGE: ghcr.io/itmeansbigmountain/trap-chat-backend

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # Never build off the back of a failed infra run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: backend
        run: pip install --no-cache-dir -r requirements.txt pytest==8.3.5

      - name: Test
        working-directory: backend
        run: |
          python -m py_compile app.py
          python -m pytest tests/ -q

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit SHA so the deploy stage rolls out an immutable,
      # traceable image rather than a moving tag.
      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    name: Deploy
    needs: build
    # Pull requests build but never deploy.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: backend-prod
    steps:
      # ---------------------------------------------------------------
      # APPROVAL GATE for the backend deploy
      #
      # The real gate is the GitHub Environment `backend-prod` named in
      # `environment:` above. Required reviewers live in repo settings, not
      # in YAML, so this file cannot switch them on by itself:
      #
      #   Settings -> Environments -> backend-prod
      #     -> Required reviewers -> add ItMeansBigMountain -> Save
      #
      # Until that is set, GitHub auto-creates the environment with NO
      # protection and this stage runs unattended.
      #
      # If you would rather keep the approver in version control, uncomment
      # the step below instead. It pauses the run and waits for ItMeansBigMountain
      # to approve in an issue it opens. It needs `issues: write` added to
      # the workflow's `permissions:` block.
      #
      # - name: Wait for ItMeansBigMountain to approve
      #   uses: trstringer/manual-approval@v1
      #   with:
      #     secret: ${{ github.TOKEN }}
      #     approvers: ItMeansBigMountain
      #     minimum-approvals: 1
      #     issue-title: "Approve the backend deploy for ${{ github.sha }}"
      # ---------------------------------------------------------------
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Pushing an image does not change what a running Container App serves:
      # Azure never re-pulls a mutable tag on its own. Roll out the immutable
      # per-commit tag so every deploy is a distinct, traceable revision.
      - name: Roll out image to Container App
        run: |
          az extension add --name containerapp --upgrade -y
          # infra CICD can be mid-apply on the same Container App. Azure
          # rejects a second concurrent modification with 409
          # ContainerAppOperationInProgress, so wait for it to drain first.
          for i in $(seq 1 60); do
            state=$(az containerapp show --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.provisioningState -o tsv 2>/dev/null || echo NotFound)
            echo "attempt $i: provisioningState=$state"
            case "$state" in
              InProgress|Provisioning|Deleting) sleep 10 ;;
              *) break ;;
            esac
          done
          # Right after an infra change the control plane can briefly answer
          # "does not exist" for an app that demonstrably does, and it returns
          # 409 while another operation drains. Both clear on their own, so
          # retry rather than failing the deploy.
          for attempt in 1 2 3 4 5; do
            if az containerapp update \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "${IMAGE}:${{ github.sha }}"; then
              echo "rollout succeeded on attempt $attempt"
              exit 0
            fi
            echo "rollout attempt $attempt failed, retrying in 20s"
            sleep 20
          done
          echo "::error::could not roll out the image after 5 attempts"
          exit 1

      - name: Verify backend health
        run: |
          fqdn=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "Checking https://${fqdn}/api/health"
          for i in $(seq 1 10); do
            if curl --fail --max-time 20 "https://${fqdn}/api/health"; then
              echo
              echo "- Backend: https://${fqdn}/api/health" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $i failed, retrying in 15s"
            sleep 15
          done
          echo "::error::backend health check never returned success"
          exit 1
