name: Deploy Trap Chat to Azure Static Web Apps

on:
  push:
    branches: [main]
    paths:
      - 'frontend/expo/**'
      - '.github/workflows/azure-static-web-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and deploy Expo frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/expo/package-lock.json

      - name: Install dependencies
        working-directory: frontend/expo
        run: npm ci

      - name: Typecheck
        working-directory: frontend/expo
        run: npx tsc --noEmit

      - name: Export web build
        working-directory: frontend/expo
        run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.TRAP_CHAT_API_URL }}
          EXPO_PUBLIC_SOCKET_URL: ${{ vars.TRAP_CHAT_SOCKET_URL }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/expo/dist
          skip_app_build: true
          output_location: ''
