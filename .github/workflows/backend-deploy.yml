name: Deploy Trap Chat Backend to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and deploy Flask backend
    env:
      RESOURCE_GROUP: rg-trap-chat-prod
      APP_NAME: trap-chat-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install --no-cache-dir -r requirements.txt

      - name: Python syntax check
        working-directory: backend
        run: python -m py_compile app.py api/index.py

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -q

      - name: Azure login via service principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: Azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          resource-group: ${{ env.RESOURCE_GROUP }}
          package: backend
          startup-command: "gunicorn --worker-class gthread --threads 100 --timeout 120 --bind 0.0.0.0:$PORT app:app"

      - name: Verify deployment
        if: always()
        run: |
          az login --service-principal -u ${{ vars.AZURE_CLIENT_ID }} -p ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ vars.AZURE_TENANT_ID }} >/dev/null
          hostname=$(az webapp show --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query defaultHostName -o tsv)
          echo "Checking https://${hostname}/api/health"
          curl --fail --max-time 30 "https://${hostname}/api/health" | jq .
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}