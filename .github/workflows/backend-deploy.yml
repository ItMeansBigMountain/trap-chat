name: Build Trap Chat Backend Container

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    name: Test and publish backend image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install --no-cache-dir -r requirements.txt pytest==8.3.5
      - name: Verify backend
        working-directory: backend
        run: |
          python -m py_compile app.py api/index.py
          python -m pytest tests/ -q
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/itmeansbigmountain/trap-chat-backend:${{ github.sha }}
            ghcr.io/itmeansbigmountain/trap-chat-backend:latest
      - name: Verify published image
        run: docker pull ghcr.io/itmeansbigmountain/trap-chat-backend:${{ github.sha }}
