name: Build Trap Chat Backend Container

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  RESOURCE_GROUP: rg-trap-chat-prod
  CONTAINER_APP_NAME: trap-chat-api
  IMAGE: ghcr.io/itmeansbigmountain/trap-chat-backend

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    name: Test and publish backend image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: backend
        run: pip install --no-cache-dir -r requirements.txt pytest==8.3.5
      - name: Verify backend
        working-directory: backend
        run: |
          python -m py_compile app.py api/index.py
          python -m pytest tests/ -q
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
      - name: Verify published image
        run: docker pull ${{ env.IMAGE }}:${{ github.sha }}

      # Building and pushing a new image does not, by itself, change what a
      # running Container App revision serves: Azure Container Apps does not
      # poll registries for tag updates, so without this step every push
      # after the first `terraform apply` would silently never reach
      # production. Roll out the immutable per-commit tag explicitly instead
      # of relying on the mutable `:latest` tag.
      - name: Azure login via service principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Roll out new image to Container App
        run: |
          az extension add --name containerapp --upgrade -y
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${IMAGE}:${{ github.sha }}"

      - name: Verify live deployment
        if: always()
        run: |
          hostname=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "Checking https://${hostname}/api/health"
          curl --fail --max-time 30 "https://${hostname}/api/health"
