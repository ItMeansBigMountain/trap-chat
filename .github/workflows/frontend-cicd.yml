name: frontend CICD

# BUILDS AND SHIPS THE WEB APP
# BUILD COMPILES, DEPLOY PUBLISHES
# DEPLOY WAITS FOR APPROVAL

on:
  # PUSH TO MAIN DEPLOYS
  push:
    branches: [main]
    paths:
      - 'frontend/expo/**'
      - '.github/workflows/frontend-cicd.yml'
  # PULL REQUESTS ONLY BUILD
  pull_request:
    paths:
      - 'frontend/expo/**'
      - '.github/workflows/frontend-cicd.yml'
  # NEW INFRA TRIGGERS REBUILD
  workflow_run:
    workflows: ["infra CICD"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# ONE FRONTEND DEPLOY AT A TIME
concurrency:
  group: trap-chat-frontend-cicd
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-trap-chat-prod
  CONTAINER_APP_NAME: trap-chat-api
  STATIC_WEB_APP_NAME: stapp-trap-chat-prod

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # SKIP AFTER FAILED INFRA RUN
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      # FETCH THE SOURCE
      - uses: actions/checkout@v4

      # PYTHON RUNS THE SMOKE SUITES
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # INSTALL NODE, CACHE PACKAGES
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/expo/package-lock.json

      # INSTALL EXACT LOCKED PACKAGES
      - name: Install dependencies
        working-directory: frontend/expo
        run: npm ci

      # FAIL ON TYPE ERRORS
      - name: Typecheck
        working-directory: frontend/expo
        run: npx tsc --noEmit

      # PROVE IT COMPILES, FAKE BACKEND
      - name: Build (pull request check only)
        if: github.event_name == 'pull_request'
        working-directory: frontend/expo
        run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: https://backend.invalid
          EXPO_PUBLIC_SOCKET_URL: https://backend.invalid

      # SIGN IN TO AZURE
      - name: Azure login
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ASK AZURE THE REAL HOSTNAME
      # NEVER SHIP A GUESSED URL
      - name: Resolve verified backend URL
        if: github.event_name != 'pull_request'
        id: backend_url
        run: |
          fqdn=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true)
          if [ -z "$fqdn" ]; then
            echo "::error::Could not resolve the Container App ingress FQDN. Run the infra CICD pipeline first."
            exit 1
          fi
          echo "url=https://${fqdn}" >> "$GITHUB_OUTPUT"
          echo "Backend URL: https://${fqdn}"

      # RUN THE UI AGAINST A REAL BACKEND
      # CATCHES BROKEN SCREENS BEFORE DEPLOY
      - name: Pre-deployment smoke tests
        if: github.event_name != 'pull_request'
        env:
          PYTHONPATH: backend
        run: |
          set -e
          python -m pip install --quiet -r backend/requirements.txt playwright requests
          python -m playwright install --with-deps chromium
          DATABASE_URL="sqlite:///$RUNNER_TEMP/smoke.db" SECRET_KEY=ci-smoke python - <<'PY' &
          from app import app, socketio
          socketio.run(app, host='127.0.0.1', port=8091, allow_unsafe_werkzeug=True)
          PY
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8091/api/health >/dev/null && break
            sleep 1
          done
          python backend/e2e/api_smoke.py http://127.0.0.1:8091 --include-scoring
          # Build the test bundle into its own directory and reset the
          # bundler cache. Metro keys its cache on sources, not on
          # EXPO_PUBLIC_* values, so reusing dist let this bundle ship.
          ( cd frontend/expo && EXPO_PUBLIC_API_URL=http://127.0.0.1:8091               EXPO_PUBLIC_SOCKET_URL=http://127.0.0.1:8091               npx expo export --platform web --output-dir dist-test --clear )
          python -m http.server 8100 --bind 127.0.0.1 --directory frontend/expo/dist-test &
          sleep 3
          python frontend/expo/e2e/rep_counter.py http://127.0.0.1:8100/
          python frontend/expo/e2e/smoke.py http://127.0.0.1:8100/
          python frontend/expo/e2e/ranked_match.py http://127.0.0.1:8100/
          rm -rf frontend/expo/dist-test

      # BAKE BACKEND URL INTO BUNDLE
      - name: Export web build
        if: github.event_name != 'pull_request'
        working-directory: frontend/expo
        run: npx expo export --platform web --clear
        env:
          EXPO_PUBLIC_API_URL: ${{ steps.backend_url.outputs.url }}
          EXPO_PUBLIC_SOCKET_URL: ${{ steps.backend_url.outputs.url }}

      # REFUSE TO SHIP A TEST BACKEND
      # A CACHED BUNDLE ONCE LEAKED LOCALHOST
      - name: Verify the bundle points at production
        if: github.event_name != 'pull_request'
        run: |
          if grep -rq "127.0.0.1:8091" frontend/expo/dist; then
            echo "::error::The built bundle contains the test backend URL."
            exit 1
          fi
          if ! grep -rq "${{ steps.backend_url.outputs.url }}" frontend/expo/dist; then
            echo "::error::The built bundle does not contain the production backend URL."
            exit 1
          fi
          echo "bundle points at ${{ steps.backend_url.outputs.url }}"

      # HAND BUNDLE TO DEPLOY STAGE
      - name: Upload web bundle Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: trap-chat-web-bundle
          path: frontend/expo/dist
          retention-days: 5

  deploy:
    name: Deploy
    needs: build
    # PULL REQUESTS NEVER DEPLOY
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: frontend-prod
    steps:
      # APPROVAL GATE, SET IN SETTINGS
      # SETTINGS > ENVIRONMENTS > FRONTEND-PROD
      # ADD ItMeansBigMountain AS REVIEWER
      # UNSET MEANS DEPLOY RUNS UNATTENDED
      #
      # OR UNCOMMENT TO GATE HERE
      # - name: Wait for ItMeansBigMountain to approve
      #   uses: trstringer/manual-approval@v1
      #   with:
      #     secret: ${{ github.TOKEN }}
      #     approvers: ItMeansBigMountain
      #     minimum-approvals: 1
      #     issue-title: "Approve the frontend deploy for ${{ github.sha }}"

      # FETCH THE TEST SCRIPTS
      - uses: actions/checkout@v4

      # SHIP EXACTLY WHAT WAS BUILT
      - uses: actions/download-artifact@v4
        with:
          name: trap-chat-web-bundle
          path: dist

      # SIGN IN TO AZURE
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # READ TOKEN FROM AZURE, MASKED
      # STORED COPIES GO STALE SILENTLY
      - name: Resolve Static Web App deployment token
        id: swa
        run: |
          token=$(az staticwebapp secrets list \
            --name "$STATIC_WEB_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.apiKey" -o tsv)
          if [ -z "$token" ]; then
            echo "::error::Could not read the Static Web App deployment token."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      # UPLOAD BUNDLE TO AZURE
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          output_location: ''

      # CONFIRM THE SITE ANSWERS
      - name: Verify frontend
        id: site
        run: |
          hostname=$(az staticwebapp show --name "$STATIC_WEB_APP_NAME" --resource-group "$RESOURCE_GROUP" --query defaultHostname -o tsv)
          echo "url=https://${hostname}/" >> "$GITHUB_OUTPUT"
          echo "Checking https://${hostname}/"
          curl --fail --max-time 30 -o /dev/null -w "HTTP %{http_code}\n" "https://${hostname}/"
          echo "- Frontend: https://${hostname}" >> "$GITHUB_STEP_SUMMARY"

      # DRIVE THE DEPLOYED SITE FOR REAL
      # HTTP 200 IS NOT A WORKING APP
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Post-deployment integration tests
        run: |
          # The backend may be mid-rollout from its own pipeline, and it scales
          # to zero when idle. Wake it before driving the UI at it.
          fqdn=$(az containerapp show --name "$CONTAINER_APP_NAME"             --resource-group "$RESOURCE_GROUP"             --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            curl -sf --max-time 30 "https://${fqdn}/api/health" >/dev/null && break
            echo "waiting for the backend ($i)"
            sleep 10
          done
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python frontend/expo/e2e/smoke.py "${{ steps.site.outputs.url }}"
