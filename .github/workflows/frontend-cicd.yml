name: frontend CICD

# Two stages, so the run shows two bubbles: Build, then Deploy behind a
# manual approval gate.
#
#   Build  -> typecheck, export the web bundle, upload it as an artifact
#   Deploy -> publish that exact bundle to Azure Static Web Apps and verify
#
# The approval gate is enforced by the GitHub Environment `frontend-prod`,
# which must have at least one Required Reviewer configured under
# Settings -> Environments. GitHub auto-creates an environment on first use
# with NO protection rules, so without that one-time setup Deploy runs
# unattended.
#
# Triggers:
#   - push to main touching frontend/expo/  -> build, then gated deploy
#   - pull request touching frontend/expo/  -> build only, never deploys
#   - after a successful "infra CICD"       -> rebuild against the new backend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/expo/**'
      - '.github/workflows/frontend-cicd.yml'
  pull_request:
    paths:
      - 'frontend/expo/**'
      - '.github/workflows/frontend-cicd.yml'
  workflow_run:
    workflows: ["infra CICD"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trap-chat-frontend-cicd
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-trap-chat-prod
  CONTAINER_APP_NAME: trap-chat-api
  STATIC_WEB_APP_NAME: stapp-trap-chat-prod

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # Never build off the back of a failed infra run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/expo/package-lock.json

      - name: Install dependencies
        working-directory: frontend/expo
        run: npm ci

      - name: Typecheck
        working-directory: frontend/expo
        run: npx tsc --noEmit

      - name: Build (pull request check only)
        if: github.event_name == 'pull_request'
        working-directory: frontend/expo
        run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: https://backend.invalid
          EXPO_PUBLIC_SOCKET_URL: https://backend.invalid

      - name: Azure login
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve verified backend URL
        if: github.event_name != 'pull_request'
        id: backend_url
        run: |
          fqdn=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true)
          if [ -z "$fqdn" ]; then
            echo "::error::Could not resolve the Container App ingress FQDN. Run the infra CICD pipeline first."
            exit 1
          fi
          echo "url=https://${fqdn}" >> "$GITHUB_OUTPUT"
          echo "Backend URL: https://${fqdn}"

      - name: Export web build
        if: github.event_name != 'pull_request'
        working-directory: frontend/expo
        run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: ${{ steps.backend_url.outputs.url }}
          EXPO_PUBLIC_SOCKET_URL: ${{ steps.backend_url.outputs.url }}

      - name: Upload web bundle Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: trap-chat-web-bundle
          path: frontend/expo/dist
          retention-days: 5

  deploy:
    name: Deploy
    needs: build
    # Pull requests build but never deploy.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: frontend-prod
    steps:
      # ---------------------------------------------------------------
      # APPROVAL GATE for the frontend deploy
      #
      # The real gate is the GitHub Environment `frontend-prod` named in
      # `environment:` above. Required reviewers live in repo settings, not
      # in YAML, so this file cannot switch them on by itself:
      #
      #   Settings -> Environments -> frontend-prod
      #     -> Required reviewers -> add ItMeansBigMountain -> Save
      #
      # Until that is set, GitHub auto-creates the environment with NO
      # protection and this stage runs unattended.
      #
      # If you would rather keep the approver in version control, uncomment
      # the step below instead. It pauses the run and waits for ItMeansBigMountain
      # to approve in an issue it opens. It needs `issues: write` added to
      # the workflow's `permissions:` block.
      #
      # - name: Wait for ItMeansBigMountain to approve
      #   uses: trstringer/manual-approval@v1
      #   with:
      #     secret: ${{ github.TOKEN }}
      #     approvers: ItMeansBigMountain
      #     minimum-approvals: 1
      #     issue-title: "Approve the frontend deploy for ${{ github.sha }}"
      # ---------------------------------------------------------------
      - uses: actions/download-artifact@v4
        with:
          name: trap-chat-web-bundle
          path: dist

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Read the deployment token from Azure rather than a stored secret. The
      # token belongs to the Static Web App instance, so recreating that app
      # (a region change, for example) rotates it and any stored copy silently
      # goes stale. Masked so it never appears in logs.
      - name: Resolve Static Web App deployment token
        id: swa
        run: |
          token=$(az staticwebapp secrets list \
            --name "$STATIC_WEB_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.apiKey" -o tsv)
          if [ -z "$token" ]; then
            echo "::error::Could not read the Static Web App deployment token."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          output_location: ''

      - name: Verify frontend
        run: |
          hostname=$(az staticwebapp show --name "$STATIC_WEB_APP_NAME" --resource-group "$RESOURCE_GROUP" --query defaultHostname -o tsv)
          echo "Checking https://${hostname}/"
          curl --fail --max-time 30 -o /dev/null -w "HTTP %{http_code}\n" "https://${hostname}/"
          echo "- Frontend: https://${hostname}" >> "$GITHUB_STEP_SUMMARY"
