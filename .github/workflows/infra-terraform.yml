name: Terraform Azure Infrastructure

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra-terraform.yml'
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra-terraform.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the reviewed Terraform plan
        type: boolean
        default: false
      force_unlock_id:
        description: Stale Terraform lock ID to recover after confirming no run is active
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: trap-chat-terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  ARM_USE_OIDC: false
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_ACCESS_KEY: ${{ secrets.TFSTATE_STORAGE_KEY }}
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: infra-prod
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - name: Preflight Azure service-account configuration
        shell: bash
        env:
          CLIENT: ${{ vars.AZURE_CLIENT_ID }}
          TENANT: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          for value in CLIENT TENANT SUBSCRIPTION CLIENT_SECRET AZURE_CREDENTIALS; do
            test -n "${!value}" || { echo "::error::$value is missing"; exit 1; }
          done
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform fmt check
        run: terraform fmt -check -recursive
      - name: Terraform init
        run: terraform init
      - name: Recover explicitly identified stale Terraform lock
        if: github.event_name == 'workflow_dispatch' && inputs.force_unlock_id != ''
        run: terraform force-unlock -force "${{ inputs.force_unlock_id }}"
      - name: Import pre-existing Azure resources into Terraform state
        shell: bash
        run: |
          terraform state list | grep -q '^azurerm_resource_group.trap_chat$' || \
            timeout 5m terraform import -input=false -var-file=env/prod.tfvars \
              azurerm_resource_group.trap_chat \
              "/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/rg-trap-chat-prod"
          terraform state list | grep -q '^azurerm_static_web_app.frontend$' || \
            timeout 5m terraform import -input=false -var-file=env/prod.tfvars \
              azurerm_static_web_app.frontend \
              "/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/rg-trap-chat-prod/providers/Microsoft.Web/staticSites/stapp-trap-chat-prod"
      - name: Terraform validate
        run: terraform validate
      - name: Terraform plan
        run: terraform plan -var-file=env/prod.tfvars -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: trap-chat-terraform-plan
          path: infra/terraform/tfplan
      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.apply == true
        run: terraform apply -auto-approve tfplan
