name: infra CICD

# BUILDS AND CHANGES THE INFRASTRUCTURE
# PLAN SHOWS IT, APPLY DOES IT
# APPLY WAITS FOR APPROVAL

on:
  # PULL REQUESTS ONLY PLAN
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra-cicd.yml'
  # PUSH TO MAIN APPLIES
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra-cicd.yml'
  workflow_dispatch:
    inputs:
      # RECOVER A STUCK STATE LOCK
      force_unlock_id:
        description: Stale Terraform lock ID to recover after confirming no run is active
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: write

# ONE INFRA CHANGE AT A TIME
concurrency:
  group: trap-chat-infra-cicd
  cancel-in-progress: false

env:
  ARM_USE_OIDC: false
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_ACCESS_KEY: ${{ secrets.TFSTATE_STORAGE_KEY }}
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: infra-prod
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      # FETCH THE SOURCE
      - uses: actions/checkout@v4

      # FAIL EARLY ON MISSING CREDENTIALS
      - name: Preflight Azure service-account configuration
        shell: bash
        env:
          CLIENT: ${{ vars.AZURE_CLIENT_ID }}
          TENANT: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          for value in CLIENT TENANT SUBSCRIPTION CLIENT_SECRET AZURE_CREDENTIALS; do
            test -n "${!value}" || { echo "::error::$value is missing"; exit 1; }
          done

      # SIGN IN TO AZURE
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: false

      # INSTALL TERRAFORM
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # REJECT UNFORMATTED TERRAFORM
      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      # LOAD PROVIDERS AND REMOTE STATE
      - name: Terraform init
        run: terraform init

      # CLEAR A LOCK LEFT BEHIND
      - name: Recover explicitly identified stale Terraform lock
        if: github.event_name == 'workflow_dispatch' && inputs.force_unlock_id != ''
        run: terraform force-unlock -force "${{ inputs.force_unlock_id }}"

      # ADOPT RESOURCES MADE OUTSIDE TERRAFORM
      - name: Import pre-existing Azure resources into Terraform state
        shell: bash
        run: |
          terraform state list | grep -q '^azurerm_resource_group.trap_chat$' || \
            timeout 5m terraform import -input=false -var-file=env/prod.tfvars \
              azurerm_resource_group.trap_chat \
              "/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/rg-trap-chat-prod"
          terraform state list | grep -q '^azurerm_static_web_app.frontend$' || \
            timeout 5m terraform import -input=false -var-file=env/prod.tfvars \
              azurerm_static_web_app.frontend \
              "/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/rg-trap-chat-prod/providers/Microsoft.Web/staticSites/stapp-trap-chat-prod"

      # CATCH CONFIGURATION ERRORS
      - name: Terraform validate
        run: terraform validate

      # WORK OUT WHAT WOULD CHANGE
      - name: Terraform plan
        run: terraform plan -var-file=env/prod.tfvars -out=tfplan

      # SHOW THE PLAN BEFORE APPROVING
      # READ THIS FOR DESTROYS
      - name: Publish plan to run summary
        run: |
          {
            echo '## Terraform plan'
            echo
            echo '```terraform'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # HAND PLAN TO APPLY STAGE
      - uses: actions/upload-artifact@v4
        with:
          name: trap-chat-terraform-plan
          path: infra/terraform/tfplan
          retention-days: 5

  apply:
    name: Apply (requires approval)
    needs: plan
    # PULL REQUESTS NEVER APPLY
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: infra-prod-apply
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      # APPROVAL GATE, SET IN SETTINGS
      # SETTINGS > ENVIRONMENTS > INFRA-PROD-APPLY
      # ADD ItMeansBigMountain AS REVIEWER
      # UNSET MEANS APPLY RUNS UNATTENDED
      #
      # OR UNCOMMENT TO GATE HERE
      # - name: Wait for ItMeansBigMountain to approve
      #   uses: trstringer/manual-approval@v1
      #   with:
      #     secret: ${{ github.TOKEN }}
      #     approvers: ItMeansBigMountain
      #     minimum-approvals: 1
      #     issue-title: "Approve the Terraform apply for ${{ github.sha }}"

      # FETCH THE SOURCE
      - uses: actions/checkout@v4

      # SIGN IN TO AZURE
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: false

      # INSTALL TERRAFORM
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # LOAD PROVIDERS AND REMOTE STATE
      - name: Terraform init
        run: terraform init

      # COLLECT THE APPROVED PLAN
      - uses: actions/download-artifact@v4
        with:
          name: trap-chat-terraform-plan
          path: infra/terraform

      # WAIT OUT ANY RUNNING DEPLOY
      # AZURE REJECTS CONCURRENT CHANGES
      - name: Wait for Container App to be idle
        run: |
          for i in $(seq 1 60); do
            state=$(az containerapp show --name trap-chat-api \
              --resource-group rg-trap-chat-prod \
              --query properties.provisioningState -o tsv 2>/dev/null || echo NotFound)
            echo "attempt $i: provisioningState=$state"
            case "$state" in
              InProgress|Provisioning|Deleting) sleep 10 ;;
              *) exit 0 ;;
            esac
          done
          echo "::warning::Container App still provisioning after 10 minutes; attempting apply anyway"

      # APPLY EXACTLY THE REVIEWED PLAN
      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      # PRINT THE LIVE URLS
      - name: Publish endpoints to run summary
        run: |
          {
            echo '## Deployed endpoints'
            echo
            echo "- Backend: $(terraform output -raw backend_url)"
            echo "- Frontend: https://$(terraform output -raw static_web_app_hostname)"
          } >> "$GITHUB_STEP_SUMMARY"
