name: Trap Chat CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/expo/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: https://YOUR_BACKEND_HOST
          EXPO_PUBLIC_SOCKET_URL: https://YOUR_BACKEND_HOST

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py api/index.py
      - run: python -c "from app import app; client=app.test_client(); r=client.get('/health'); assert r.status_code == 200; print(r.json)"
