<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Trap Chat</title>
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style>
      /* The bundle takes a few seconds to parse and boot, and until React
         mounts the page is a white rectangle, which reads as broken rather
         than loading. This paints on the first byte of HTML and is replaced
         the moment React renders into #root. It is inline on purpose: a
         separate stylesheet would be one more round trip before anything
         appears. */
      body {
        margin: 0;
        background: #000;
      }
      #boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        width: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #boot .mark {
        font-size: 34px;
        font-weight: 900;
        letter-spacing: -0.8px;
      }
      #boot .trap {
        color: #ccff00;
      }
      #boot .chat {
        color: #7b5cff;
      }
      #boot .bar {
        width: 132px;
        height: 3px;
        border-radius: 2px;
        background: #1f1f1f;
        overflow: hidden;
      }
      #boot .bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #7b5cff;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(330%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar i {
          animation: none;
          width: 100%;
        }
      }
    </style>
    <link rel="icon" href="/favicon.ico" />
  </head>

  <body>
    <noscript>
      Trap Chat needs JavaScript to run. Enable it and reload.
    </noscript>
    <div id="root">
      <div id="boot">
        <div class="mark"><span class="trap">Trap</span><span class="chat">Chat</span></div>
        <div class="bar"><i></i></div>
      </div>
    </div>
  </body>
</html>
